# Tests, compilation et publication sur GitHub Pages à chaque envoi sur la branche main.
# Pour publier la prévisualisation après un envoi sur la branche apercu : lancer ce workflow à la main (workflow_dispatch) sur main.
name: Tests et publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      # Tests des écrans et de l'accessibilité dans un vrai navigateur, sur le site compilé.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ecrans
      # Site de prévisualisation : la branche « apercu », si elle existe, est compilée dans le sous-dossier apercu/.
      # L'enseignant y valide les nouveautés avant qu'elles soient fusionnées dans main. Un échec ici ne bloque pas
      # la publication du site des élèves.
      - name: Prévisualisation (branche apercu)
        continue-on-error: true
        run: |
          set -e
          if ! git ls-remote --exit-code --heads origin apercu > /dev/null; then echo "Pas de branche apercu."; exit 0; fi
          git fetch --depth 1 origin apercu
          git worktree add ../apercu-src FETCH_HEAD
          cd ../apercu-src
          npm ci
          npm test
          npm run check
          VITE_APERCU=1 npm run build
          rm -f dist/sw.js
          mkdir -p "$GITHUB_WORKSPACE/dist/apercu"
          cp -r dist/. "$GITHUB_WORKSPACE/dist/apercu/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
